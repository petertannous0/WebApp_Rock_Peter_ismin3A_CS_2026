# Soutenances de stage: the whole application, from one command.
#
#   docker compose up
#
# No .env to create: every variable has its default here. The database is a
# SQLite file in the named volume `data`, shared by `migrate` and `api`.
#
#   migrate  applies the migrations, seeds, then exits (code 0)
#   api      starts once migrate has succeeded; healthy when GET /health answers
#   web      starts once api is healthy; nginx serves the built front

name: soutenances

x-database-url: &database-url file:/app/db/soutenances.db

services:
  migrate:
    build:
      context: ./api
      target: build
    environment:
      DATABASE_URL: *database-url
    # A shell, for the `&&`: without it, the seed would be passed to Prisma as arguments.
    command: sh -c "npx --no-install prisma migrate deploy && npm run db:seed"
    volumes:
      - data:/app/db

  api:
    build: ./api
    environment:
      DATABASE_URL: *database-url
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-in-production}
      PORT: 3000
      WEB_ORIGIN: http://localhost:8080
    ports:
      - "3000:3000"
    volumes:
      - data:/app/db
    depends_on:
      migrate:
        condition: service_completed_successfully
    # node:26-alpine has wget, not curl.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        # The browser calls the API from the host machine: localhost, not `api`.
        VITE_API_URL: http://localhost:3000
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  data:
